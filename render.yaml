services:
  - type: web
    name: breathconnection-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: breathconnection-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: S3_BUCKET
        value: ""
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: CDN_BASE
        value: ""

databases:
  - name: breathconnection-db
    databaseName: breathconnection
    user: breathconn
    region: oregon
    plan: free
