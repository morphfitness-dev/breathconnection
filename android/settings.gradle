pluginManagement {
    // react-settings-plugin is committed locally — always available without node_modules
    includeBuild('react-settings-plugin')
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins { id("com.facebook.react.settings") }

rootProject.name = 'The Breath Connection'

// @react-native/gradle-plugin provides com.facebook.react for app/build.gradle
includeBuild(new File(settingsDir, "../node_modules/@react-native/gradle-plugin"))

dependencyResolutionManagement {
    versionCatalogs {
        reactAndroidLibs {
            from(files(new File(settingsDir, "../node_modules/react-native/gradle/libs.versions.toml")))
        }
    }
}

apply from: new File(settingsDir, "../node_modules/expo/scripts/autolinking.gradle")
useExpoModules()

apply from: new File(settingsDir, "../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesSettingsGradle(settings)

include ':app'
